name: Validate ACIE artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate schemas and state models
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run state-model tests
        run: python -m unittest discover -s tests -v
      - name: Validate artifacts
        run: python tests/validate_artifacts.py
